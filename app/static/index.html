<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Heating Cost Tracker</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><defs><linearGradient id='g' x1='0' y1='1' x2='0' y2='0'><stop offset='0' stop-color='%23d9382b'/><stop offset='1' stop-color='%23f5a623'/></linearGradient></defs><path fill='url(%23g)' d='M32 2c3 11 18 18 18 35a18 18 0 0 1-36 0c0-8 4-14 8-18 0 7 3 10 6 11-3-10 2-20 4-28z'/><path fill='%23ffd56b' d='M32 30c2 5 7 8 7 14a7 7 0 0 1-14 0c0-6 5-9 7-14z'/></svg>">
<style>
:root{--bg:#f6f7f5;--card:#fff;--ink:#1d2321;--muted:#66706b;--line:#e3e6e3;--gas:#d9822b;--ac:#2a7fbf;--exp:#9aa7b0;--good:#1f8a4c;--bad:#c0392b}
@media (prefers-color-scheme:dark){:root{--bg:#111514;--card:#1a201e;--ink:#e8ece9;--muted:#9aa5a0;--line:#2b3330;--gas:#f0a050;--ac:#5aa9e6;--exp:#6c7a84;--good:#4cc27e;--bad:#ef6b5b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:1100px;margin:0 auto;padding:20px 16px 60px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:16px}
h1{font-size:22px;margin:0}
h2{font-size:16px;margin:0 0 4px}
.sub{color:var(--muted);font-size:13px}
button,select,input[type=file]{font:inherit}
button{background:var(--ink);color:var(--bg);border:0;border-radius:8px;padding:8px 14px;cursor:pointer}
button.secondary{background:transparent;color:var(--ink);border:1px solid var(--line)}
button:disabled{opacity:.5;cursor:wait}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px}
.grid .card{margin:0}
.big{font-size:28px;font-weight:650;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.label{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:6px}
.good{color:var(--good)}.bad{color:var(--bad)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{background:transparent;color:var(--muted);border-radius:0;padding:6px 12px}
.seg button.on{background:var(--ink);color:var(--bg)}
select{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;line-height:1.4;padding:6px 9px;border-radius:6px;white-space:pre;display:none;z-index:10;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin:6px 0}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
svg text{fill:var(--muted);font-size:11px}
.chart{width:100%;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--muted);font-weight:500}
.tablewrap{overflow-x:auto}
.pill{display:inline-block;padding:1px 7px;border-radius:99px;font-size:11px;color:#fff}
.warn{background:color-mix(in srgb,var(--gas) 14%,var(--card));border-color:color-mix(in srgb,var(--gas) 40%,var(--line))}
.warn li{margin:2px 0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
details summary{cursor:pointer;color:var(--muted)}
.ok{color:var(--good)}.err{color:var(--bad)}
</style>
</head>
<body>
<main>
<header>
  <div>
    <h1>Heating Cost Tracker</h1>
    <div class="sub" id="subtitle">Gas boiler vs air-to-air</div>
  </div>
  <div class="row">
    <a href="api/daily.csv"><button class="secondary">Export CSV</button></a>
    <button id="syncBtn">Sync now</button>
  </div>
</header>

<div id="warnings"></div>

<div class="grid" id="cards"></div>

<div class="card">
  <div class="row" style="justify-content:space-between">
    <h2 id="costTitle">Heating cost, at today's prices</h2>
    <div class="row">
      <div class="seg" id="granularity">
        <button data-g="day">Daily</button><button data-g="week">Weekly</button><button data-g="month" class="on">Monthly</button>
      </div>
      <select id="range"></select>
    </div>
  </div>
  <div class="sub" id="costSub"></div>
  <div class="legend" id="costLegend"></div>
  <div class="chart" id="calChart"></div>
  <div class="sub" id="costTotals" style="margin-top:6px"></div>
</div>

<div class="card">
  <div class="row" style="justify-content:space-between">
    <h2>Heat needed vs outside temperature</h2>
    <div class="seg" id="heatGran">
      <button data-g="day" class="on">Daily</button><button data-g="week">Weekly</button><button data-g="month">Monthly</button>
    </div>
  </div>
  <div class="sub" id="heatSub"></div>
  <div class="legend">
    <span><span class="sw" style="background:var(--gas)"></span>Gas era: heat delivered, kWh/day</span>
    <span><span class="sw" style="background:var(--ac)"></span>Air-to-air: electricity, kWh/day</span>
  </div>
  <div class="chart" id="scatter"></div>
</div>

<div class="card">
  <h2>Monthly detail</h2>
  <div class="tablewrap"><table id="monthly"></table></div>
</div>

<div class="card">
  <h2>Data</h2>
  <div class="tablewrap"><table id="sources"></table></div>
  <form id="importForm" class="row" style="margin-top:12px">
    <input type="file" name="file" accept=".csv,text/csv" required>
    <select name="metric">
      <option value="">Fuel from file</option>
      <option value="electricity">Electricity</option>
      <option value="gas">Gas</option>
      <option value="ac">Air-to-air (AC)</option>
      <option value="hot_water">Hot water (electric)</option>
    </select>
    <button type="submit" class="secondary">Import CSV</button>
    <span id="importMsg" class="sub"></span>
  </form>
  <details style="margin-top:12px"><summary>Sync log</summary><div class="tablewrap"><table id="log"></table></div></details>
  <details style="margin-top:8px"><summary>How this is calculated</summary><div class="sub" id="method" style="margin-top:8px"></div></details>
</div>
</main>
<div class="tip" id="tip"></div>

<script>
const $ = s => document.querySelector(s);
const gbp = v => v == null ? '–' : (v < 0 ? '−' : '') + '£' + Math.abs(v).toLocaleString('en-GB', {maximumFractionDigits: 0});
const gbp2 = v => v == null ? '–' : '£' + v.toFixed(2);
const num = (v, d = 0) => v == null ? '–' : v.toLocaleString('en-GB', {maximumFractionDigits: d, minimumFractionDigits: d});
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function card(label, value, sub, cls = '') {
  return `<div class="card"><div class="label">${label}</div><div class="big ${cls}">${value}</div><div class="sub">${sub || ''}</div></div>`;
}

function renderCards(d) {
  const p = d.projection || {}, s = d.since_switch, m = d.models || {}, set = d.settings;
  const pe = p.prices ? num(p.prices.electricity * 100, 2) + 'p/kWh' : '', pg = p.prices ? num(p.prices.gas * 100, 2) + 'p/kWh' : '';
  const acYear = p.ac_measured ?? p.ac_expected, acMeasured = p.ac_measured != null;
  const out = [];
  if (!set.keep_gas_supply) {
    // Gas disconnected: compare everything gas used to do with its all-electric replacement.
    out.push(card('Gas, typical year', gbp(p.gas_all_in),
      p.gas != null ? `Heating ${gbp(p.gas)} + hot water/cooking ${gbp(p.hot_water_gas)} + standing charge ${gbp(p.gas_standing_saved)}` : 'Needs gas + weather history'));
    out.push(card(`All-electric, typical year${acMeasured ? '' : ' (expected)'}`, gbp(p.elec_all_in),
      p.elec_all_in != null ? `Air-to-air ${gbp(acYear)}${acMeasured ? '' : ` at SCOP ${set.expected_scop}`} + electric hot water ${gbp(p.hot_water_elec)}${p.hot_water_elec_measured ? '' : ' (estimated)'}, at ${pe}` : ''));
    if (p.gas_all_in != null && p.elec_all_in != null) {
      const diff = p.elec_all_in - p.gas_all_in;
      out.push(card(diff > 0 ? 'Extra cost per year' : 'Saving per year', gbp(Math.abs(diff)),
        `Like-for-like: same weather, today's prices${acMeasured ? '' : ', before real data'}`, diff > 0 ? 'bad' : 'good'));
    }
    if (s) {
      const delta = s.gas_all_in_equiv != null ? s.all_in_cost - s.gas_all_in_equiv : null;
      out.push(card(`Since switching (${s.days} days)`, gbp(s.all_in_cost),
        s.gas_all_in_equiv != null ? `Gas would have cost ${gbp(s.gas_all_in_equiv)} in the same weather (${delta > 0 ? '+' : '−'}${gbp(Math.abs(delta))})${s.estimated ? '. AC use estimated.' : ''}` : ''));
    }
  } else {
    out.push(card('Gas heating, typical year', gbp(p.gas), p.gas != null ? `${num(d.reference_year?.hdd)} degree days at ${pg}` : 'Needs gas + weather history'));
    out.push(card(`Air-to-air heating, typical year${acMeasured ? '' : ' (expected)'}`, gbp(acYear),
      acMeasured ? `Measured so far, at ${pe}` : `If the units average SCOP ${set.expected_scop}, at ${pe}`));
    if (p.gas != null && acYear != null) {
      const diff = acYear - p.gas;
      out.push(card(diff > 0 ? 'Extra cost per year' : 'Saving per year', gbp(Math.abs(diff)), 'Heating only; gas kept for hot water', diff > 0 ? 'bad' : 'good'));
    }
    if (s) {
      const delta = s.gas_equiv_cost != null ? s.ac_heating_cost - s.gas_equiv_cost : null;
      out.push(card(`Since switching (${s.days} days)`, gbp(s.ac_heating_cost),
        s.gas_equiv_cost != null ? `Gas would have cost ${gbp(s.gas_equiv_cost)} in the same weather (${delta > 0 ? '+' : '−'}${gbp(Math.abs(delta))})` : ''));
    }
  }
  out.push(card('Effective efficiency', p.effective_cop != null ? num(p.effective_cop, 1) + '×' : '–',
    p.effective_cop != null ? 'kWh of heat per kWh of electricity' : 'Shown once there are 14+ air-to-air days'));
  out.push(card('Hot water and cooking',
    m.non_heating_gas_kwh_per_day != null ? num(m.non_heating_gas_kwh_per_day, 1) + ' kWh/day gas' : '–',
    set.keep_gas_supply ? 'Stays on gas' : (p.hot_water_elec_kwh_per_day != null ?
      `Now ${num(p.hot_water_elec_kwh_per_day, 1)} kWh/day electric (shower + undersink heaters)${p.hot_water_elec_measured ? '' : ', estimated'}` : '')));
  $('#cards').innerHTML = out.join('');
}

function barChart(el, cats, series) {
  const W = Math.max(600, cats.length * 70), H = 260, L = 48, B = 28, T = 10;
  const max = Math.max(1, ...series.flatMap(s => s.values.filter(v => v != null)));
  const step = niceStep(max / 4), top = Math.ceil(max / step) * step;
  const y = v => T + (H - T - B) * (1 - v / top);
  const gw = (W - L - 10) / cats.length, bw = Math.min(18, (gw - 10) / series.length);
  let g = '';
  for (let v = 0; v <= top + 1e-9; v += step)
    g += `<line x1="${L}" x2="${W - 10}" y1="${y(v)}" y2="${y(v)}" stroke="${css('--line')}"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">£${v}</text>`;
  cats.forEach((c, i) => {
    const x0 = L + i * gw + (gw - bw * series.length) / 2;
    series.forEach((s, j) => {
      const v = s.values[i];
      if (v == null) return;
      g += `<rect x="${x0 + j * bw}" y="${y(v)}" width="${bw - 2}" height="${y(0) - y(v)}" rx="2" fill="${s.color}" style="cursor:pointer" data-tip="${esc(cats[i] + '\n' + s.name + ': £' + v.toFixed(2))}"/>`;
    });
    g += `<text x="${L + i * gw + gw / 2}" y="${H - 8}" text-anchor="middle">${c}</text>`;
  });
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="100%" style="min-width:${Math.min(W, 560)}px">${g}</svg>`;
}

function niceStep(x) {
  const p = Math.pow(10, Math.floor(Math.log10(x || 1))), f = x / p;
  return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * p;
}

function scatter(el, sets) {
  const W = 700, H = 312, L = 44, B = 48, T = 10, R = 12, base = DATA.settings.hdd_base_c;
  const pts = sets.flatMap(s => s.points);
  if (!pts.length) { el.innerHTML = '<div class="sub" style="padding:30px 0">No data with temperatures yet.</div>'; return; }
  const xmax = Math.max(1, ...pts.map(p => p[0])), ymax = Math.max(1, ...pts.map(p => p[1]));
  const xs = niceStep(xmax / 5), ys = niceStep(ymax / 4);
  const xt = Math.ceil(xmax / xs) * xs, yt = Math.ceil(ymax / ys) * ys;
  const X = v => L + (W - L - R) * v / xt, Y = v => T + (H - T - B) * (1 - v / yt);
  let g = '';
  for (let v = 0; v <= yt + 1e-9; v += ys) g += `<line x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}" stroke="${css('--line')}"/><text x="${L - 6}" y="${Y(v) + 4}" text-anchor="end">${v}</text>`;
  for (let v = 0; v <= xt + 1e-9; v += xs) g += `<text x="${X(v)}" y="${H - 32}" text-anchor="middle">${v}</text><text x="${X(v)}" y="${H - 19}" text-anchor="${v === 0 ? 'start' : v + xs > xt + 1e-9 ? 'end' : 'middle'}" style="font-size:10px;opacity:.75">${+(base - v).toFixed(1)}°C</text>`;
  g += `<text x="${(W + L) / 2}" y="${H - 2}" text-anchor="middle">${sets.xLabel || 'Heating degree days (colder →)'} · outside temperature below</text>`;
  sets.forEach(s => {
    s.points.forEach(p => g += `<circle cx="${X(p[0])}" cy="${Y(Math.max(0, p[1]))}" r="${s.r || 2.6}" fill="${s.color}" fill-opacity="${s.op || .55}" stroke="transparent" stroke-width="8" style="cursor:pointer"${p[3] ? ` data-tip="${esc(p[3])}"` : ''}/>`);
    if (s.fit) {
      const a = s.fit.a, b = s.fit.b, x2 = Math.max(...s.points.map(p => p[0]));
      g += `<line x1="${X(0)}" y1="${Y(Math.max(0, a))}" x2="${X(x2)}" y2="${Y(Math.max(0, a + b * x2))}" stroke="${s.color}" stroke-width="2.5"/>`;
    }
  });
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="100%" style="min-width:520px">${g}</svg>`;
}

function renderMonthly(d) {
  const head = '<tr><th>Month</th><th>System</th><th>Degree days</th><th>Gas kWh</th><th>Elec kWh</th><th>AC heat kWh</th><th>Hot water kWh</th><th>Heating £</th><th>£ per degree day</th><th>Whole bill £</th><th>Indoor °C</th></tr>';
  const rows = d.monthly.slice().reverse().map(m => {
    const [y, mo] = m.month.split('-');
    const pill = `<span class="pill" style="background:${m.era === 'gas' ? css('--gas') : css('--ac')}">${m.era === 'gas' ? 'Gas' : 'Air-to-air'}</span>`;
    return `<tr><td>${MONTHS[+mo - 1]} ${y}${m.days < 28 ? ` <span class="sub">(${m.days}d)</span>` : ''}</td><td>${pill}</td><td>${num(m.hdd)}</td><td>${num(m.gas_kwh)}</td><td>${num(m.elec_kwh)}</td><td>${num(m.ac_kwh)}</td><td>${m.hw_kwh ? num(m.hw_kwh) : '–'}</td><td>${gbp2(m.heating_cost)}</td><td>${m.cost_per_hdd != null ? gbp2(m.cost_per_hdd) : '–'}</td><td>${gbp2(m.total_cost)}</td><td>${m.indoor_avg ?? '–'}</td></tr>`;
  });
  $('#monthly').innerHTML = head + rows.join('');
}

function renderSources(d) {
  $('#sources').innerHTML = '<tr><th>Metric</th><th>Source</th><th>Days</th><th>From</th><th>To</th></tr>' +
    d.sources.map(s => `<tr><td>${esc(s.metric)}</td><td>${esc(s.source)}</td><td>${s.days}</td><td>${s.first}</td><td>${s.last}</td></tr>`).join('');
  $('#log').innerHTML = '<tr><th>When (UTC)</th><th>Source</th><th>Result</th></tr>' +
    d.sync_log.map(l => `<tr><td>${esc(l.ts.replace('T', ' ').slice(0, 16))}</td><td>${esc(l.source)}</td><td style="text-align:left;white-space:normal" class="${l.ok ? 'ok' : 'err'}">${esc(l.message)}</td></tr>`).join('');
}

function renderMethod(d) {
  const m = d.models, s = d.settings, r = d.reference_year;
  const fit = (f, unit) => f ? `${num(f.a, 1)} + ${num(f.b, 2)} × degree days (${unit}, R² ${num(f.r2, 2)}, ${f.n} days)` : 'not enough data yet';
  $('#method').innerHTML = `
    <p>Degree days use a ${s.hdd_base_c}°C base and Open-Meteo temperatures for your location. Reference weather year: ${r ? `${r.start} to ${r.end} (${num(r.hdd)} degree days)` : 'not available yet'}.</p>
    <p>Gas model: ${fit(m.gas, 'kWh gas/day')}. The fixed part (${num(m.non_heating_gas_kwh_per_day, 1)} kWh/day) is treated as hot water and cooking; the rest is heating. Boiler efficiency assumed ${s.boiler_efficiency * 100}%.</p>
    <p>Air-to-air model: ${fit(m.ac, 'kWh electricity/day')}. Days above ${s.cooling_threshold_c}°C count as cooling unless a separate cooling sensor is configured.</p>
    <p>Projections use today's unit rates for both fuels so price changes don't distort the comparison. With the gas disconnected, the comparison covers everything gas used to do: heating, hot water/cooking (now the electric shower and undersink heaters, assumed to need ${s.hot_water_electric_factor} kWh of electricity per kWh of gas unless measured) and the gas standing charge. Once solar is fitted, air-to-air kWh covered by solar are costed at your export rate (the income you gave up), not the import rate.</p>`;
}

let DATA = null, GRAN = 'month', RANGE = {};
const RANGES = {day: [[30, 'Last 30 days'], [60, 'Last 60 days'], [90, 'Last 90 days']],
                week: [[13, 'Last 13 weeks'], [26, 'Last 26 weeks'], [52, 'Last 52 weeks'], [104, 'Last 2 years']]};
const sw = (c, label, pale) => `<span><span class="sw" style="background:${c};${pale ? 'opacity:.4' : ''}"></span>${label}</span>`;

function weekStart(ds) {          // Monday of the ISO week, as YYYY-MM-DD
  const dt = new Date(ds + 'T12:00:00Z'), wd = (dt.getUTCDay() + 6) % 7;
  dt.setUTCDate(dt.getUTCDate() - wd);
  return dt.toISOString().slice(0, 10);
}
const fmtDay = ds => { const [y, m, dd] = ds.split('-'); return `${+dd} ${MONTHS[+m - 1]}`; };

function renderCostChart() {
  const d = DATA;
  document.querySelectorAll('#granularity button').forEach(b => b.classList.toggle('on', b.dataset.g === GRAN));
  const sel = $('#range');
  if (GRAN === 'month') {
    sel.style.display = 'none';
    $('#costTitle').textContent = "Heating cost by month, at today's prices";
    $('#costSub').textContent = "Gas year vs air-to-air. Air-to-air months are scaled to the gas year's weather so a mild or cold month doesn't skew the comparison.";
    $('#costLegend').innerHTML = sw(css('--gas'), 'Gas (reference year)') + sw(css('--exp'), `Air-to-air, expected (SCOP ${d.settings.expected_scop})`) + sw(css('--ac'), 'Air-to-air, actual (weather-adjusted)');
    $('#costTotals').textContent = '';
    barChart($('#calChart'), d.calendar.map(c => MONTHS[c.cal - 1]), [
      {name: 'Gas', color: css('--gas'), values: d.calendar.map(c => c.gas_now)},
      {name: 'Air-to-air expected', color: css('--exp'), values: d.calendar.map(c => c.ac_expected)},
      {name: 'Air-to-air actual', color: css('--ac'), values: d.calendar.map(c => c.ac_adj)},
    ]);
    return;
  }
  sel.style.display = '';
  const opts = RANGES[GRAN], cur = RANGE[GRAN] ?? opts[1][0];
  sel.innerHTML = opts.map(([v, l]) => `<option value="${v}" ${v == cur ? 'selected' : ''}>${l}</option>`).join('');
  const unit = GRAN === 'day' ? 'day' : 'week';
  $('#costTitle').textContent = `Heating cost by ${unit}, at today's prices`;
  const acBasis = d.ac_estimate_basis === 'measured' ? 'your measured air-to-air efficiency' : `SCOP ${d.settings.expected_scop}`;
  $('#costSub').textContent = `Both systems for every ${unit}, in that ${unit}'s weather. Solid is what the running system actually cost; pale is an estimate for the other system (gas from your gas-year model, air-to-air from ${acBasis}).`;
  $('#costLegend').innerHTML = sw(css('--gas'), 'Gas, actual') + sw(css('--gas'), 'Gas, estimated', true) + sw(css('--ac'), 'Air-to-air, actual') + sw(css('--ac'), 'Air-to-air, estimated', true);

  // bucket the daily series
  const buckets = new Map();
  for (const r of d.daily_costs) {
    const k = GRAN === 'day' ? r.d : weekStart(r.d);
    const b = buckets.get(k) || {k, ga: 0, ge: 0, aa: 0, ae: 0, n: 0, t: 0};
    for (const f of ['ga', 'ge', 'aa', 'ae']) b[f] += r[f] || 0;
    b.n++; b.t += r.t; buckets.set(k, b);
  }
  const list = [...buckets.values()].sort((a, b) => a.k < b.k ? -1 : 1).slice(-cur);
  if (!list.length) { $('#calChart').innerHTML = '<div class="sub" style="padding:30px 0">No data with temperatures yet.</div>'; $('#costTotals').textContent = ''; return; }
  const labels = list.map(b => GRAN === 'day' ? fmtDay(b.k) : 'w/c ' + fmtDay(b.k));
  stackedBars($('#calChart'), labels, list.map(b => [
    [{v: b.ga, c: css('--gas'), n: 'Gas, actual'}, {v: b.ge, c: css('--gas'), o: .4, n: 'Gas, estimated'}],
    [{v: b.aa, c: css('--ac'), n: 'Air-to-air, actual'}, {v: b.ae, c: css('--ac'), o: .4, n: 'Air-to-air, estimated'}],
  ]), list.map((b, i) => `${labels[i]} · avg ${num(b.t / b.n, 1)}°C${GRAN === 'week' && b.n < 7 ? ` · ${b.n} of 7 days so far` : ''}`));
  const tot = list.reduce((s, b) => ({g: s.g + b.ga + b.ge, a: s.a + b.aa + b.ae}), {g: 0, a: 0});
  const diff = tot.a - tot.g;
  $('#costTotals').innerHTML = `Over this period: gas <b>${gbp2(tot.g)}</b> vs air-to-air <b>${gbp2(tot.a)}</b> · ` +
    `<span class="${diff > 0 ? 'bad' : 'good'}">air-to-air ${diff > 0 ? 'costs' : 'saves'} ${gbp2(Math.abs(diff))}</span> (heating only)`;
}

function stackedBars(el, cats, groups, titles) {
  const n = cats.length, gw = Math.max(14, Math.min(70, 900 / n)), L = 48, B = 28, T = 10, H = 260;
  const W = Math.max(600, L + 10 + n * gw);
  const max = Math.max(0.5, ...groups.flatMap(g => g.map(st => st.reduce((s, x) => s + (x.v || 0), 0))));
  const step = niceStep(max / 4), top = Math.ceil(max / step) * step;
  const y = v => T + (H - T - B) * (1 - v / top);
  const bw = Math.max(4, Math.min(18, (gw - 4) / 2));
  const every = Math.ceil(n / Math.floor((W - L) / 60));
  let g = '';
  for (let v = 0; v <= top + 1e-9; v += step)
    g += `<line x1="${L}" x2="${W - 10}" y1="${y(v)}" y2="${y(v)}" stroke="${css('--line')}"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">£${+v.toFixed(2)}</text>`;
  groups.forEach((stacks, i) => {
    const x0 = L + i * gw + (gw - bw * 2) / 2;
    g += `<g style="cursor:pointer" data-tip="${esc(titles[i] + '\n' + stacks.flat().filter(s => s.v > 0.004).map(s => `${s.n}: £${s.v.toFixed(2)}`).join('\n'))}">`;
    g += `<rect x="${L + i * gw}" y="${T}" width="${gw}" height="${H - T - B}" fill="transparent"/>`;
    stacks.forEach((st, j) => {
      let base = 0;
      st.forEach(seg => {
        if (!(seg.v > 0)) return;
        g += `<rect x="${x0 + j * bw}" y="${y(base + seg.v)}" width="${Math.max(1, bw - 1.5)}" height="${y(base) - y(base + seg.v)}" fill="${seg.c}" fill-opacity="${seg.o || 1}"/>`;
        base += seg.v;
      });
    });
    g += '</g>';
    if (i % every === 0) g += `<text x="${L + i * gw + gw / 2}" y="${H - 8}" text-anchor="middle">${cats[i]}</text>`;
  });
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="100%" style="min-width:${Math.min(W, 560)}px">${g}</svg>`;
}

let HEAT_GRAN = 'day';
const HEAT_LABEL = {gas: 'Heat from gas boiler', ac: 'Air-to-air electricity'};
const tag = (pts, src) => { const out = pts.map(p => [p[0], p[1], p[2], null, src]); out.src = src; return out; };
// Weekly/monthly points are averages per day, so the axes and trend lines stay the same; they just smooth out the noise.
function bucketPoints(points, gran) {
  const base = DATA.settings.hdd_base_c, temp = h => h > 0 ? `${num(base - h, 1)}°C` : `${base}°C or warmer`;
  if (gran === 'day') return points.map(p => [p[0], p[1], p[2], `${fmtDay(p[2])} ${p[2].slice(0, 4)}\nAverage outside: ${temp(p[0])} (${num(p[0], 1)} degree days)\n${HEAT_LABEL[p[4]]}: ${num(p[1], 1)} kWh`]);
  const m = new Map();
  for (const [x, y, ds] of points) {
    const k = gran === 'week' ? weekStart(ds) : ds.slice(0, 7);
    const b = m.get(k) || {k, x: 0, y: 0, n: 0, s: points.src}; b.x += x; b.y += y; b.n++; m.set(k, b);
  }
  return [...m.values()].filter(b => b.n >= 3).map(b => {
    const label = gran === 'week' ? `w/c ${fmtDay(b.k)} ${b.k.slice(0, 4)}` : `${MONTHS[+b.k.slice(5, 7) - 1]} ${b.k.slice(0, 4)}`;
    return [b.x / b.n, b.y / b.n, b.k, `${label} (${b.n} days)\nAverage outside: ${temp(b.x / b.n)} (${num(b.x / b.n, 1)} degree days)\n${HEAT_LABEL[b.s]}: ${num(b.y / b.n, 1)} kWh/day on average`];
  });
}

function renderHeat() {
  const d = DATA, eff = d.settings.boiler_efficiency, gran = HEAT_GRAN;
  document.querySelectorAll('#heatGran button').forEach(b => b.classList.toggle('on', b.dataset.g === gran));
  const unit = {day: 'a day', week: 'a week (daily average)', month: 'a month (daily average)'}[gran];
  $('#heatSub').textContent = `Each dot is ${unit}. Gas dots show useful heat (gas × boiler efficiency); air-to-air dots show electricity used. The gap between the lines is the efficiency difference.` +
    (gran === 'day' ? '' : ' Averaging smooths out day-to-day noise such as sunny days or days away.');
  const r = {day: 2.6, week: 4.5, month: 7}[gran], op = {day: .55, week: .7, month: .8}[gran];
  const sets = [
    {color: css('--gas'), points: bucketPoints(tag(d.scatter.gas, 'gas'), gran), fit: d.models.gas ? {a: 0, b: d.models.gas.b * eff} : null, r, op},
    {color: css('--ac'), points: bucketPoints(tag(d.scatter.ac, 'ac'), gran), fit: d.models.ac, r, op},
  ];
  sets.xLabel = gran === 'day' ? 'Heating degree days (colder →)' : 'Average heating degree days per day (colder →)';
  scatter($('#scatter'), sets);
}
const TIP = $('#tip');
function showTip(e) {
  const t = e.target.closest && e.target.closest('[data-tip]');
  if (!t) { TIP.style.display = 'none'; return; }
  TIP.textContent = t.dataset.tip; TIP.style.display = 'block';
  const w = TIP.offsetWidth, h = TIP.offsetHeight;
  TIP.style.left = Math.min(e.clientX + 14, innerWidth - w - 8) + 'px';
  TIP.style.top = (e.clientY + 14 + h > innerHeight ? e.clientY - h - 10 : e.clientY + 14) + 'px';
}
document.addEventListener('mousemove', showTip);
document.addEventListener('click', showTip);
document.querySelectorAll('#heatGran button').forEach(b => b.onclick = () => { HEAT_GRAN = b.dataset.g; renderHeat(); });

document.querySelectorAll('#granularity button').forEach(b => b.onclick = () => { GRAN = b.dataset.g; renderCostChart(); });
$('#range').onchange = e => { RANGE[GRAN] = +e.target.value; renderCostChart(); };

async function load() {
  const d = await (await fetch('api/dashboard')).json();
  $('#subtitle').textContent = d.switch_date ? `Gas boiler until ${d.switch_date}, air-to-air after` : 'Gas boiler vs air-to-air';
  $('#warnings').innerHTML = d.warnings.length ? `<div class="card warn"><ul style="margin:0;padding-left:18px">${d.warnings.map(w => `<li>${esc(w)}</li>`).join('')}</ul></div>` : '';
  renderCards(d);
  DATA = d;
  renderCostChart();
  renderHeat();
  renderMonthly(d);
  renderSources(d);
  renderMethod(d);
}

$('#syncBtn').onclick = async e => {
  e.target.disabled = true; e.target.textContent = 'Syncing…';
  try { await fetch('api/sync', {method: 'POST'}); await load(); }
  finally { e.target.disabled = false; e.target.textContent = 'Sync now'; }
};
$('#importForm').onsubmit = async e => {
  e.preventDefault();
  const r = await (await fetch('api/import', {method: 'POST', body: new FormData(e.target)})).json();
  $('#importMsg').textContent = r.message; $('#importMsg').className = r.ok ? 'ok' : 'err';
  if (r.ok) load();
};
load();
</script>
